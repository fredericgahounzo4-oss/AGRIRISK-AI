services:
  # --- Backend Django (API) ---
  - type: web
    name: agririsk-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn agririsk_backend.wsgi:application --timeout 120"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false   # à définir manuellement : URL de ton frontend Render
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false   # à coller : la connection string Neon (postgresql://...)
      - key: GROQ_API_KEY
        sync: false   # à définir manuellement (clé console.groq.com, "gsk_...")
      - key: CLOUDINARY_URL
        sync: false   # à coller : cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      # --- Paiement FedaPay ---
      - key: FEDAPAY_SECRET_KEY
        sync: false   # clé secrète FedaPay ("sk_sandbox_..." ou "sk_live_...")
      - key: FEDAPAY_ENV
        value: sandbox   # passer à "live" quand le compte FedaPay est validé
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false   # clé du webhook FedaPay ("wh_...")
      - key: FRONTEND_URL
        sync: false   # URL du frontend Render, ex: https://agririsk-frontend.onrender.com
      - key: MARKETPLACE_COMMISSION_PERCENT
        value: "5"

  # --- Frontend Vite (site statique) ---
  - type: web
    name: agririsk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # à définir : URL du backend + /api, ex: https://agririsk-backend.onrender.com/api
      - key: VITE_MOCK_MODE
        value: "false"
      - key: VITE_MAP_TILE_URL
        value: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
