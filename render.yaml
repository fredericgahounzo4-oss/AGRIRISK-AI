services:
  # --- Backend Django (API) ---
  - type: web
    name: agririsk-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn agririsk_backend.wsgi:application --timeout 120"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false   # à définir manuellement : URL de ton frontend Render
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        sync: false   # à coller : la connection string Neon (postgresql://...)
      - key: GEMINI_API_KEY
        sync: false   # à définir manuellement (clé Google AI Studio)

  # --- Frontend Vite (site statique) ---
  - type: web
    name: agririsk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # à définir : URL du backend + /api, ex: https://agririsk-backend.onrender.com/api
      - key: VITE_MOCK_MODE
        value: "false"
      - key: VITE_MAP_TILE_URL
        value: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
